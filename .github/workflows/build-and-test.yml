name: build-and-test
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  IMAGE: soenneker/cloudflare-clamav
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 11.0.100-rc.3.26522.148
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Verify application and API contract
        run: |
          dotnet test --project test/Soenneker.Cloudflare.Clamav.Tests --configuration Release
          dotnet build src/Soenneker.Cloudflare.Clamav --configuration Release -p:OpenApiGenerateDocuments=true
      - name: Verify durable Worker
        working-directory: worker
        run: |
          npm ci
          npm run typecheck
          npm test
          npm audit --omit=dev --audit-level=high
      - name: Build image
        run: docker build --platform linux/amd64 -t "$IMAGE:sha-${{ github.sha }}" .
      - name: Exercise final native image
        run: |
          python -m pip install -r scripts/requirements-test.txt
          python scripts/container-smoke.py "$IMAGE:sha-${{ github.sha }}"
      - name: Verify complete durable pipeline and Worker restart
        run: python scripts/worker-smoke.py
      - name: Reject high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: '${{ env.IMAGE }}:sha-${{ github.sha }}'
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: '${{ env.IMAGE }}:sha-${{ github.sha }}'
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: scanner-sbom.spdx.json
