name: publish-image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: soenneker/cloudflare-clamav

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test --project test/Soenneker.Cloudflare.Clamav.Tests/Soenneker.Cloudflare.Clamav.Tests.csproj --configuration Release
      - name: Build image
        run: docker build --platform linux/amd64 -t "$IMAGE:sha-${{ github.sha }}" .
      - name: Log in to Docker Hub
        env:
          REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login docker.io -u soenneker --password-stdin
      - name: Push image
        env:
          REVISION: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          docker push "$IMAGE:sha-$REVISION"
          if [ "$REF_TYPE" = tag ]; then
            docker tag "$IMAGE:sha-$REVISION" "$IMAGE:$REF_NAME"
            docker push "$IMAGE:$REF_NAME"
          fi
          if [[ "$REF_TYPE" = branch && "$REF_NAME" = main ]] || [[ "$REF_TYPE" = tag && "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            docker tag "$IMAGE:sha-$REVISION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
